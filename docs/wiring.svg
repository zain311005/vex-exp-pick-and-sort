<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590">
<rect x="0" y="0" width="960" height="590" fill="#ffffff"/>
<text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#222222" font-weight="bold">Clawbot wiring: which Smart Port each motor and sensor uses</text>
<rect x="30" y="60" width="220" height="500" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
<text x="140" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">EXP Brain</text>
<rect x="50" y="104" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 1</text>
<rect x="50" y="148" width="180" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="62" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#888888">Port 2   free</text>
<rect x="50" y="192" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 3</text>
<rect x="50" y="236" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 4</text>
<rect x="50" y="280" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="302" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 5</text>
<rect x="50" y="324" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="346" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 6</text>
<rect x="50" y="368" width="180" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="62" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#888888">Port 7   free</text>
<rect x="50" y="412" width="180" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="62" y="434" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#888888">Port 8   free</text>
<rect x="50" y="456" width="180" height="34" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="62" y="478" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#888888">Port 9   free</text>
<rect x="50" y="500" width="180" height="34" rx="4" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="62" y="522" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222" font-weight="bold">Port 10</text>
<path d="M 230.0 121.0 L 321.1 104.6" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,103.0 321.9,109.0 320.3,100.2" fill="#333333"/>
<rect x="330" y="70" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="91" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Optical Sensor (port 1)</text>
<text x="344" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">OPTICAL_PORT = 1</text>
<text x="344" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">claw palm, at ball height, facing into the claw</text>
<path d="M 230.0 209.0 L 321.2 187.1" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,185.0 322.3,191.5 320.2,182.7" fill="#333333"/>
<rect x="330" y="152" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="173" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Arm motor (port 3)</text>
<text x="344" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">ARM_PORT = 3</text>
<text x="344" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">on the tower, drives the arm gear</text>
<path d="M 230.0 253.0 L 321.1 265.8" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,267.0 320.5,270.2 321.7,261.3" fill="#333333"/>
<rect x="330" y="234" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="255" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Claw motor (port 4)</text>
<text x="344" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">CLAW_PORT = 4</text>
<text x="344" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">on the claw</text>
<path d="M 230.0 297.0 L 322.0 344.8" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,349.0 319.9,348.8 324.1,340.9" fill="#333333"/>
<rect x="330" y="316" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="337" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Distance Sensor (port 5)</text>
<text x="344" y="355" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">DISTANCE_PORT = 5</text>
<text x="344" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">front centre, about 50 mm up, facing forward</text>
<path d="M 230.0 341.0 L 323.3 425.0" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,431.0 320.3,428.3 326.3,421.6" fill="#333333"/>
<rect x="330" y="398" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="419" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Left drive motor (port 6)</text>
<text x="344" y="437" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">LEFT_DRIVE_PORT = 6</text>
<text x="344" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">left side, turns the traction wheel</text>
<path d="M 230.0 517.0 L 321.0 513.4" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="330.0,513.0 321.2,517.9 320.8,508.9" fill="#333333"/>
<rect x="330" y="480" width="310" height="66" rx="6" fill="#ffffff" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="344" y="501" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222" font-weight="bold">Right drive motor (port 10)</text>
<text x="344" y="519" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#2b5d8a">RIGHT_DRIVE_PORT = 10</text>
<text x="344" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#222222">right side, turns the traction wheel</text>
<text x="805" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="bold">Top view sketch, not to scale</text>
<text x="805" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">front (claw end)</text>
<path d="M 805.0 118.0 L 805.0 113.0" fill="none" stroke="#333333" stroke-width="1.5"/>
<polygon points="805.0,104.0 809.5,113.0 800.5,113.0" fill="#333333"/>
<rect x="722" y="200" width="166" height="262" rx="8" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/>
<rect x="758" y="120" width="18" height="84" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="834" y="120" width="18" height="84" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<line x1="758" y1="204" x2="852" y2="204" stroke="#333333" stroke-width="3"/>
<rect x="700" y="214" width="22" height="56" rx="3" fill="#e6e6e6" stroke="#333333" stroke-width="1.5"/>
<rect x="700" y="392" width="22" height="56" rx="3" fill="#bbbbbb" stroke="#333333" stroke-width="1.5"/>
<rect x="888" y="214" width="22" height="56" rx="3" fill="#e6e6e6" stroke="#333333" stroke-width="1.5"/>
<rect x="888" y="392" width="22" height="56" rx="3" fill="#bbbbbb" stroke="#333333" stroke-width="1.5"/>
<text x="805" y="488" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">omni wheels at the front,</text>
<text x="805" y="502" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">driven traction wheels at the back</text>
<rect x="778" y="360" width="54" height="30" rx="3" fill="#dce9f5" stroke="#2b5d8a" stroke-width="1.5"/>
<text x="805" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">Brain</text>
<circle cx="778" cy="196" r="12" fill="#2b5d8a"/>
<text x="778" y="200.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="805" cy="300" r="12" fill="#2b5d8a"/>
<text x="805" y="304.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<circle cx="860" cy="150" r="12" fill="#2b5d8a"/>
<text x="860" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="832" cy="222" r="12" fill="#2b5d8a"/>
<text x="832" y="226.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<circle cx="742" cy="420" r="12" fill="#2b5d8a"/>
<text x="742" y="424.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text>
<circle cx="868" cy="420" r="12" fill="#2b5d8a"/>
<text x="868" y="424.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text>
<text x="700" y="530" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222222">Numbers are Smart Ports. Build the robot from</text>
<text x="700" y="544.3" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222222">the official EXP Clawbot instructions: this</text>
<text x="700" y="558.6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222222">sketch only shows where each cable goes.</text>
</svg>
